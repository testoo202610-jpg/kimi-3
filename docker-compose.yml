services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crimson
      POSTGRES_PASSWORD: crimson
      POSTGRES_DB: crimson_ramparts
    ports:
      - "5432:5432"
    volumes:
      - crimson_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimson -d crimson_ramparts"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crimson:crimson@db:5432/crimson_ramparts
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  crimson_pgdata:
